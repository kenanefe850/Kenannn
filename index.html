<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenan Efe | Web Sitesi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }
    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
    p.subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }
    footer { margin-top: 30px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">K</div>
    <h1>Kenan Efe</h1>
    <p class="subtitle">Hoş geldiniz! Bu site GitHub Pages üzerinde yapay zeka ile hazırlandı.</p>

    <div class="links">
      <a href="https://github.com/kenanefe850" target="_blank" class="btn">GitHub Profilim</a>
      <a href="#" class="btn">Hakkımda</a>
      <a href="#" class="btn">Projelerim</a>
      <a href="#" class="btn">İletişim</a>
    </div>

    <footer>© 2026 Kenan Efe • Canlı Web Sitesi</footer>
  </div>

</body>
</html>
